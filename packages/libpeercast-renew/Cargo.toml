[package]
name = "libpeercast-renew"
version = "0.1.0"
edition = "2024"

[features]
mock = ["mockall"]

[dependencies]
peercast-gnuid = { path = "../peercast-gnuid" }
peercast-atom = { path = "../peercast-atom" }
peercast-id4 = { path = "../peercast-id4" }

anyhow = { version = "1.0.102" }
thiserror = { version = "2.0.18" }

async-trait = { version = "0.1.89" }
futures = { version = "0.3.32" }

tokio = { version = "1.51.1", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["full"] }

tracing = { version = "0.1.41" }
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
    "json",
    "fmt",
    "local-time",
] }

serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0.102"

chrono = { version = "0.4.26", features = ["serde"] }

chardetng = { version = "1.0.0" }
encoding_rs = { version = "0.8.35" }

vergen-pretty = { version = "9.1.0", features = ["header"] }

mockall = { version = "0.14.0", optional = true }

[dev-dependencies]


[build-dependencies]
# Buildtime generate info
vergen = { version = "9.1.0", features = ["build", "cargo", "rustc"] }
vergen-git2 = { version = "9.1.0" }
