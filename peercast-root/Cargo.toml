[package]
name = "peercast-root"
version = "0.1.0"
edition = "2024"
default-run = "peercast-root"


[dependencies]
libpeercast-re = { version = "*", path = "../libpeercast-re" }

anyhow = { version = "1.0.95" }
thiserror = {version = "2.0.12"}

# tracing logging
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = [
    "env-filter",
    "json",
    "fmt",
    "local-time",
] }
tracing-journald = "0.3.1"

# Async
async-trait = "0.1.89"
futures-util = { version = "0.3.31", default-features = false, features = [
    "alloc",
] }
tokio = { version = "1.43.0", features = ["full", "tracing"] }
tokio-stream = { version = "0.1.17" }
tokio-test = { version = "0.4.4" }
tokio-util = { version = "0.7.13", features = ["rt"] }
console-subscriber = { version = "0.4.1" }

# Axum
axum-core = { version = "0.5.2" }
axum = { version = "0.8.4", features = ["tokio", "form", "ws", "tracing", "macros"] }
axum-extra = { version = "0.10.1", features = ["typed-header"] }
axum-client-ip = "1.3.1"
tower = { version = "0.5.2" }
tower-http = { version = "0.6.2", features = [
    "fs",
    "trace",
    "cors",
    "util",
    "request-id",
    "timeout",
    "add-extension",
    "set-header"
] }
hyper = { version = "1.6.0", features = ["full"] }
hyper-util = { version = "0.1.10", features = ["full"] }

# Embed files to binary
rust-embed = "8.11.0"

# MIME
mime_guess = "2.0.5"

# DB
sqlx = { version = "0.8", features = [ "runtime-tokio", "derive", "macros", "sqlite", "chrono", "json"] }

# Serialize/Deserialize
serde = { version = "1.0.217", features = ["derive"] }
# serde_derive = { version = "1.0" } # serde features = ["derive"]しているので必要ない
serde_json = "1.0.138"
toml = {version = "0.8.20"}

# url
url = { version = "2.5.4" }
html-escape = { version = "0.2.13" }


# バイナリ操作
bytes = { version = "1.10.0", features = ["serde"] }
byteorder = "1"
nom = { version = "8.0.0" }

# iterator操作
itertools = "0.14.0"

# Timezoneなどを取り扱い
chrono = { version = "0.4.40", features = ["serde"] }
chrono-tz = "0.10.3"

# Commandline
clap = { version = "4.5.27", features = ["derive", "env", "unicode"] }
clap-verbosity-flag = { version = "3.0.2", features = ["tracing"] }
serde_with = "3.13.0"

# Utoipa for OpenAPI
utoipa = { version = "5.3.1", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9.0.0", features = ["axum"] }
utoipa-axum = "0.2"

[package.metadata.deb]
maintainer = "tetsuyainfra <tetsuyainfra@007144.xyz>"
copyright = "2025, tetsuyainfra"
license-file = ["LICENSE"]
# changelog = "changelog"
assets = [
    ["target/release/peercast-root", "usr/bin/", "755"],
    ["share/debian/default/peercast-root", "etc/default/", "644"],
]
maintainer-scripts = "share/debian/"
systemd-units = { enable = false }
